<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动漫卡牌联机游戏</title>
    <style>
        :root { --primary: #7c3aed; --bg: #faf5ff; --card-bg: #fff; --border: #e5e7eb; --radius: 10px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI','PingFang SC',sans-serif; background: linear-gradient(135deg,#faf5ff,#fce7f3); min-height: 100vh; padding: 10px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1000px; background: white; border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        h1 { text-align: center; background: linear-gradient(135deg,#7c3aed,#ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 2em; margin-bottom: 8px; }
        .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
        .online { background: #10b981; } .offline { background: #ef4444; }
        .panel { display: none; } .panel.active { display: block; }
        .input-group { display: flex; gap: 10px; flex-wrap: wrap; margin: 15px 0; }
        input { padding: 10px 12px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 14px; flex: 1; min-width: 120px; }
        button { padding: 10px 18px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 14px; }
        button:active { transform: scale(0.96); } button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: #7c3aed; color: white; } .btn-success { background: #10b981; color: white; } .btn-warning { background: #f97316; color: white; } .btn-danger { background: #ef4444; color: white; } .btn-outline { background: white; color: #7c3aed; border: 2px solid #7c3aed; }
        .card-area { background: #f8f7ff; border: 2px solid #e0d7fe; border-radius: 12px; padding: 12px; margin: 10px 0; }
        .area-title { font-weight: 700; color: #7c3aed; margin-bottom: 8px; }
        .cards-grid { display: flex; flex-wrap: wrap; gap: 8px; min-height: 40px; }
        .card { background: white; border: 2px solid #c4b5fd; border-radius: 8px; padding: 10px 12px; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.2s; user-select: none; text-align: center; }
        .card:hover { border-color: #7c3aed; transform: translateY(-2px); }
        .card.selected { border-color: #ef4444; background: #fef2f2; }
        .card.black { background: #1f2937; color: white; border-color: black; }
        .card.disabled { opacity: 0.4; cursor: not-allowed; }
        .player-list { max-height: 250px; overflow-y: auto; }
        .player-item { display: flex; justify-content: space-between; padding: 10px; background: #f9fafb; border-radius: 8px; margin: 5px 0; }
        .room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; max-height: 250px; overflow-y: auto; margin: 10px 0; }
        .room-card { background: white; border: 2px solid #e0d7fe; border-radius: 10px; padding: 12px; cursor: pointer; }
        .room-card:hover { border-color: #7c3aed; }
        .turn-order { display: flex; gap: 5px; flex-wrap: wrap; margin: 8px 0; }
        .turn-tag { padding: 5px 12px; border-radius: 16px; background: #f3f4f6; font-size: 12px; font-weight: 600; }
        .turn-tag.current { background: #7c3aed; color: white; } .turn-tag.follow { background: #f97316; color: white; }
        .log-box { height: 120px; overflow-y: auto; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px; font-size: 12px; margin-top: 10px; }
        .vote-bar { display: flex; gap: 10px; align-items: center; justify-content: center; margin: 10px 0; background: #fffbeb; padding: 8px; border-radius: 8px; }
        @media (max-width: 600px) { .card { font-size: 11px; padding: 6px 8px; } button { padding: 8px 12px; font-size: 12px; } }
    </style>
</head>
<body>
<div class="container">
    <h1>🎴 动漫卡牌联机</h1>
    <div style="text-align:center; margin-bottom:10px;" id="connStatus">⏳ 连接中...</div>

    <div id="panelLobby" class="panel active">
        <div class="input-group">
            <input id="nickname" placeholder="昵称" value="玩家" maxlength="10">
            <input id="roomId" placeholder="房间号" value="888" maxlength="20">
            <input id="roomName" placeholder="房间名（选填）" value="动漫房间">
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn-primary" onclick="joinRoom()">进入/创建房间</button>
            <button class="btn-outline" onclick="send({type:'getRooms'})">刷新房间</button>
        </div>
        <h3 style="margin-top:15px;">在线房间</h3>
        <div class="room-grid" id="roomList"></div>
    </div>

    <div id="panelPrepare" class="panel">
        <h3>🏠 房间 <span id="dispRoomId">-</span> | <span id="dispRoomName">-</span></h3>
        <div class="player-list" id="playerList"></div>
        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:15px;">
            <button class="btn-success" id="readyBtn" onclick="send({type:'ready'})">✅ 准备</button>
            <button class="btn-warning" id="startBtn" onclick="send({type:'startGame'})" style="display:none;">🎮 开始游戏 (房主)</button>
            <button class="btn-outline" onclick="send({type:'leaveRoom'})">🚪 离开</button>
        </div>
    </div>

    <div id="panelGame" class="panel">
        <div id="gameStatus" style="text-align:center; font-weight:bold; color:#7c3aed;"></div>
        <div id="countdown" style="text-align:center; font-size:18px; font-weight:700;"></div>
        <div class="turn-order" id="turnOrder"></div>

        <div class="card-area">
            <div class="area-title">🟢 公共牌区</div>
            <div class="cards-grid" id="publicCards"></div>
        </div>
        <div class="card-area">
            <div class="area-title">📤 出牌区</div>
            <div class="cards-grid" id="playedCards"></div>
        </div>
        <div class="card-area" id="followArea" style="display:none;">
            <div class="area-title">⏳ 跟牌区</div>
            <div class="cards-grid" id="followCards"></div>
        </div>
        <div class="card-area">
            <div class="area-title">🖐️ 我的手牌</div>
            <div class="cards-grid" id="myHandCards"></div>
        </div>
        <div class="card-area" id="yijinArea" style="display:none;">
            <div class="area-title">🏆 一斤压力区</div>
            <div class="cards-grid" id="yijinCards"></div>
            <button class="btn-success" onclick="send({type:'confirmYijin'})" style="margin-top:6px;">✅ 确认选择并投票</button>
        </div>

        <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:10px 0;">
            <button class="btn-primary" id="drawBtn" onclick="send({type:'drawCard'})">摸牌</button>
            <button class="btn-success" id="playBtn" onclick="send({type:'playCard'})" disabled>出牌</button>
            <button class="btn-warning" id="followBtn" onclick="send({type:'followCard'})" disabled>跟牌</button>
            <button class="btn-outline" id="skipFollowBtn" onclick="send({type:'skipFollow'})" disabled>跳过跟牌</button>
            <button class="btn-danger" onclick="send({type:'resetGame'})">重置</button>
        </div>

        <div class="vote-bar" id="voteBar" style="display:none;">
            <span id="voteInfo"></span>
            <button class="btn-success" onclick="send({type:'vote', agree:true})">✅ 同意</button>
            <button class="btn-danger" onclick="send({type:'vote', agree:false})">❌ 反对</button>
        </div>

        <div class="log-box" id="logBox"></div>
    </div>
</div>

<script>
    const WS_URL = 'wss://mossy-mackerel-41.2700282515.deno.net';
    let ws, userId = 'u_' + Math.random().toString(36).substr(2, 8), roomData, panel = 'lobby';
    let nickname = '', currentRoomId = '';

    function connect() {
        ws = new WebSocket(WS_URL);
        ws.onopen = () => {
            document.getElementById('connStatus').innerHTML = '<span style="color:#10b981">已连接服务器</span>';
            send({ type: 'getRooms' });
        };
        ws.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            switch (msg.type) {
                case 'roomList': renderRoomList(msg.rooms); break;
                case 'roomData': roomData = msg.room; updateUI(); break;
                case 'error': alert(msg.text); break;
                case 'log': addLog(msg.text); break;
                case 'timer': document.getElementById('countdown').textContent = `⏱ 倒计时：${msg.seconds}s`; break;
                case 'win': alert(msg.winner + ' 获胜！'); addLog('🏆 ' + msg.winner + ' 获胜！'); break;
            }
        };
        ws.onclose = () => {
            document.getElementById('connStatus').innerHTML = '<span style="color:#ef4444">断开，5秒后重连...</span>';
            setTimeout(connect, 5000);
        };
        ws.onerror = () => ws.close();
    }

    function send(obj) {
        obj.userId = userId;
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
    }

    function switchPanel(p) {
        panel = p;
        ['panelLobby', 'panelPrepare', 'panelGame'].forEach(id => {
            document.getElementById(id).classList.toggle('active', id === 'panel' + p.charAt(0).toUpperCase() + p.slice(1));
        });
    }

    function updateUI() {
        if (!roomData) return;
        if (roomData.gameStarted) { switchPanel('game'); renderGame(); }
        else { switchPanel('prepare'); renderPrepare(); }
    }

    function renderRoomList(rooms) {
        const el = document.getElementById('roomList');
        if (!rooms || rooms.length === 0) { el.innerHTML = '<div style="text-align:center; color:#999;">暂无房间</div>'; return; }
        el.innerHTML = rooms.map(r => `
            <div class="room-card" onclick="joinRoomById('${r.id}')" style="${r.gameStarted ? 'opacity:0.5;pointer-events:none;' : ''}">
                <div><b>${r.name || r.id}</b></div>
                <div>👥 ${r.playerCount}人 ${r.gameStarted ? '(游戏中)' : ''}</div>
            </div>
        `).join('');
    }

    function joinRoomById(id) { document.getElementById('roomId').value = id; joinRoom(); }

    function joinRoom() {
        nickname = document.getElementById('nickname').value.trim() || '玩家';
        currentRoomId = document.getElementById('roomId').value.trim();
        const roomName = document.getElementById('roomName').value.trim();
        if (!currentRoomId) return alert('请输入房间号');
        send({ type: 'joinRoom', nickname, roomId: currentRoomId, roomName });
    }

    function renderPrepare() {
        document.getElementById('dispRoomId').textContent = currentRoomId;
        document.getElementById('dispRoomName').textContent = roomData.roomName || '';
        const players = roomData.players;
        const me = players.find(p => p.id === userId);
        document.getElementById('playerList').innerHTML = players.map(p => `
            <div class="player-item"><span>${p.name} ${p.isHost ? '(房主)' : ''}</span><span>${p.ready ? '✅ 已准备' : '❌ 未准备'}</span></div>
        `).join('');
        document.getElementById('readyBtn').style.display = (me && !me.ready) ? 'inline-block' : 'none';
        document.getElementById('startBtn').style.display = (me && me.isHost && players.every(p => p.ready)) ? 'inline-block' : 'none';
    }

    function renderGame() {
        if (!roomData || !roomData.gameData) return;
        const gd = roomData.gameData, players = roomData.players, me = players.find(p => p.id === userId);
        document.getElementById('gameStatus').textContent = `🏠 ${currentRoomId} | 🎯 ${players[gd.currentPlayerIdx]?.name} | ${gd.stage}`;

        let turnHtml = '';
        players.forEach((p, i) => {
            let cls = 'turn-tag';
            if (gd.stage === 'draw' || gd.stage === 'play') { if (i === gd.currentPlayerIdx) cls += ' current'; }
            else if (gd.stage === 'follow') { if (i === gd.followIdx) cls += ' follow'; else if (i === gd.roundInitiator) cls += ' current'; }
            turnHtml += `<span class="${cls}">${p.name}</span>`;
        });
        document.getElementById('turnOrder').innerHTML = turnHtml;

        document.getElementById('publicCards').innerHTML = (gd.publicCards || []).map(c => `
            <div class="card ${gd.selectedPublic === c ? 'selected' : ''}" onclick="send({type:'selectPublic', card:'${c}'})">${c}</div>
        `).join('');

        document.getElementById('playedCards').innerHTML = (gd.playedCards || []).map(c => `
            <div class="card ${gd.yijinCard === c ? 'black' : ''}">${c}</div>
        `).join('');

        const followArea = document.getElementById('followArea');
        // 在跟牌阶段或跟牌投票时显示跟牌区
        if ((gd.stage === 'follow' || (gd.stage === 'vote' && gd.voteContext === '跟牌')) && gd.followCard) {
            followArea.style.display = 'block';
            document.getElementById('followCards').innerHTML = `<div class="card selected">${gd.followCard}</div>`;
        } else {
            followArea.style.display = 'none';
            document.getElementById('followCards').innerHTML = '';
        }

        const myHand = me.handCards || [];
        const selHand = gd.selectedHand || [];
        const myIdx = players.findIndex(p => p.id === userId);
        document.getElementById('myHandCards').innerHTML = myHand.map(c => {
            const sel = selHand.includes(c) ? 'selected' : '';
            const disabled = (gd.stage === 'follow' && myHand.length <= 1) ? 'disabled' : '';
            let onclick = '';
            if (gd.stage === 'play' && myIdx === gd.currentPlayerIdx) {
                onclick = `send({type:'selectHand', card:'${c}'})`;
            } else if (gd.stage === 'follow' && myIdx === gd.followIdx && myHand.length > 1) {
                onclick = `send({type:'selectFollowCard', card:'${c}'})`;
            }
            return `<div class="card ${sel} ${disabled}" onclick="${onclick}">${c}</div>`;
        }).join('');

        if (gd.stage === 'yijin') {
            document.getElementById('yijinArea').style.display = 'block';
            document.getElementById('yijinCards').innerHTML = (gd.playedCards || []).map(c => `
                <div class="card ${gd.yijinCard === c ? 'black' : ''}" onclick="send({type:'selectYijin', card:'${c}'})">${c}</div>
            `).join('');
        } else {
            document.getElementById('yijinArea').style.display = 'none';
        }

        document.getElementById('drawBtn').disabled = !(gd.stage === 'draw' && myIdx === gd.currentPlayerIdx);
        document.getElementById('playBtn').disabled = !(gd.stage === 'play' && myIdx === gd.currentPlayerIdx && selHand.length >= 1 && selHand.length <= 3 && gd.selectedPublic);
        document.getElementById('followBtn').disabled = !(gd.stage === 'follow' && myIdx === gd.followIdx && myHand.length > 1 && gd.followCard);
        document.getElementById('skipFollowBtn').disabled = !(gd.stage === 'follow' && myIdx === gd.followIdx);

        const voteBar = document.getElementById('voteBar');
        if (gd.stage === 'vote') {
            voteBar.style.display = 'flex';
            if (gd.votedPlayers.includes(userId)) {
                document.getElementById('voteInfo').textContent = '你已投票，等待其他人...';
                voteBar.querySelectorAll('button').forEach(b => b.disabled = true);
            } else {
                document.getElementById('voteInfo').textContent = `投票阶段: ${gd.voteContext} | ✅${gd.voteAgree} ❌${gd.voteDeny} 已投${gd.votedPlayers.length}/${players.length}`;
                voteBar.querySelectorAll('button').forEach(b => b.disabled = false);
            }
        } else {
            voteBar.style.display = 'none';
        }
    }

    function addLog(text) {
        const log = document.getElementById('logBox');
        log.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${text}</div>`;
        log.scrollTop = log.scrollHeight;
    }

    window.onload = connect;
</script>
</body>
</html>
